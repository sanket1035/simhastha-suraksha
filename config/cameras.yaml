# Cameras polled by `python -m src.ingest`. One entry per camera; `zone` must match a zone in app/app.py.
# source: http(s) snapshot URL, RTSP/stream URL, video file, or a folder of images (newest image is used).
# camera: name of the angle (optional). Several cameras can share a zone; the zone total adds them up.
# ignore_top: fraction (0 to 0.95) of the frame, from the top, to leave out of the count: sky and buildings.
#   The model can mistake stone carving for a crowd, so mask it on fixed cameras. area_m2 is then the kept part.
# lat, lon, bearing, width_m (optional): where the angle's ground rectangle sits on the map. lat/lon is its
#   centre, bearing the compass direction the camera looks (0 = north), width_m how wide the ground is. Depth is
#   area_m2 / width_m. Without them the map view uses the zone's centre.
# area_m2: ground area the camera sees, measured on site (the values below are PLACEHOLDERS).
cameras:
  - zone: Ramkund
    camera: Ghat steps
    source: http://192.168.1.50/snapshot.jpg
    area_m2: 200
  - zone: Ramkund
    camera: Bridge side
    source: http://192.168.1.52/snapshot.jpg
    area_m2: 120
  - zone: Panchvati
    source: rtsp://user:password@192.168.1.51/stream1
    area_m2: 300
  - zone: Trimbakeshwar
    source: /data/trimbakeshwar_frames
    area_m2: 250
